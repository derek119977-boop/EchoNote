workflows:
  echonote-ios:
    name: EchoNote iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Inspect project
        script: |
          xcodebuild -project EchoNote.xcodeproj -scheme EchoNote -showBuildSettings
      - name: Build unsigned iPhone app
        script: |
          xcodebuild \
            -project EchoNote.xcodeproj \
            -scheme EchoNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          rm -rf Payload EchoNote-unsigned.ipa
          mkdir Payload
          ditto build/Build/Products/Release-iphoneos/EchoNote.app Payload/EchoNote.app
          /usr/bin/zip -qry EchoNote-unsigned.ipa Payload
          echo "=== IPA CONTENTS ==="
          unzip -l EchoNote-unsigned.ipa | head -30
    artifacts:
      - EchoNote-unsigned.ipa
      - build/Build/Products/Release-iphoneos/EchoNote.app
