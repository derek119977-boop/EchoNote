workflows:
  echonote-ios:
    name: EchoNote iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Inspect project
        script: |
          xcodebuild -project EchoNote.xcodeproj -scheme EchoNote -showBuildSettings
      - name: Build unsigned iPhone app
        script: |
          xcodebuild \
            -project EchoNote.xcodeproj \
            -scheme EchoNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA for sideload signing
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EchoNote.app Payload/
          zip -qry EchoNote-unsigned.ipa Payload
    artifacts:
      - EchoNote-unsigned.ipa
      - build/Build/Products/Release-iphoneos/EchoNote.app
