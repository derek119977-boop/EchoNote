workflows:
  echonote-ios:
    name: EchoNote 2.0 iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Inspect project
        script: |
          xcodebuild -project EchoNote.xcodeproj -scheme EchoNote -showBuildSettings
      - name: Build iPhone app
        script: |
          xcodebuild -project EchoNote.xcodeproj -scheme EchoNote -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Ad-hoc sign and package IPA
        script: |
          APP="build/Build/Products/Release-iphoneos/EchoNote.app"
          codesign --force --sign - "$APP"
          codesign --verify --verbose=4 "$APP"
          rm -rf Payload EchoNote-2.0.ipa
          mkdir Payload
          ditto "$APP" Payload/EchoNote.app
          /usr/bin/zip -qry EchoNote-2.0.ipa Payload
          unzip -l EchoNote-2.0.ipa | head -60
    artifacts:
      - EchoNote-2.0.ipa
      - build/Build/Products/Release-iphoneos/EchoNote.app
